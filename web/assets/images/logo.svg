<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sighting Log">
	<style>
		.ring { fill: #15803d; }
		.face { fill: #f0fdf4; }
		.needle { fill: #d97706; }
		.needle-shade { fill: #0f5132; }
		.pin { fill: #15803d; }
		@media (prefers-color-scheme: dark) {
			.face { fill: #e9f4ea; }
		}
	</style>
	<circle class="ring" cx="32" cy="32" r="30"/>
	<circle class="face" cx="32" cy="32" r="21"/>
	<path class="needle" d="M32 12 L40 32 L32 52 L24 32 Z"/>
	<path class="needle-shade" d="M32 12 L40 32 L32 32 Z"/>
	<circle class="pin" cx="32" cy="32" r="2.6"/>
</svg>
